<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bettle GIF Maker</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="titlebar">
    <img class="logo" src="img/logo.png" alt="Bettle GIF Maker">
    <span class="app-name">Bettle GIF Maker</span>
  </header>

  <main class="app">

    <!-- Drop zone -->
    <section id="dropZone" class="panel drop-zone">
      <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" multiple hidden>
      <div class="drop-content">
        <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <circle cx="9" cy="15" r="2"/>
        </svg>
        <p class="drop-title">Drop PDF, PNG, or JPG</p>
        <p class="drop-subtitle">or click to browse</p>
      </div>
      <div class="job-queue" id="jobQueue" hidden></div>
      <div class="job-blocks" id="jobBlocks" hidden></div>
    </section>

    <!-- Settings -->
    <section class="panel settings">

      <div class="field-block">
        <label class="field-label center">Time between frames</label>
        <input type="range" id="frameDelay" min="0.1" max="10" step="0.1" value="3.0">
        <div class="field-value" id="frameDelayValue">3.0s</div>
      </div>

      <div class="field-row">
        <div class="field-block field-box">
          <div class="field-row tight">
            <div class="field-block">
              <label class="field-label center">Colour reduction</label>
              <select id="colourReduction">
                <option value="selective" selected>Selective</option>
              </select>
            </div>
          </div>
        </div>
        <div class="field-block field-box">
          <div class="field-row tight">
            <div class="field-block">
              <label class="field-label center">Dither</label>
              <select id="ditherMode">
                <option value="diffusion" selected>Diffusion</option>
                <option value="atkinson">Atkinson</option>
                <option value="none">None</option>
              </select>
            </div>
            <div class="field-block narrow">
              <label class="field-label center">Strength</label>
              <div class="number-stepper">
                <input type="number" id="ditherStrength" min="0" max="100" step="1" value="100">
                <div class="number-stepper-arrows">
                  <button type="button" class="stepper-arrow" id="ditherStrengthUp" tabindex="-1" aria-label="Increase strength">
                    <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 5l4-4 4 4"/></svg>
                  </button>
                  <button type="button" class="stepper-arrow" id="ditherStrengthDown" tabindex="-1" aria-label="Decrease strength">
                    <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l4 4 4-4"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="field-row inline-row">
        <label class="field-label" for="loopCount">Loop</label>
        <select id="loopCount">
          <option value="0">Forever</option>
          <option value="1">Once</option>
          <option value="3" selected>3 times</option>
          <option value="5">5 times</option>
          <option value="10">10 times</option>
        </select>
      </div>

      <div class="field-row inline-row size-row">
        <label class="field-label">Size</label>
        <input type="number" id="outWidth" min="1" step="1" placeholder="Width">
        <span class="size-x">&times;</span>
        <input type="number" id="outHeight" min="1" step="1" placeholder="Height">
        <span class="size-unit">px</span>
      </div>

      <div class="field-block">
        <label class="field-label">File names</label>
        <div class="filename-list" id="filenameList"></div>
      </div>

      <button id="makeSelectedBtn" class="secondary-btn" disabled>Make Selected GIF</button>
      <button id="makeGifBtn" class="primary-btn" disabled>Make GIF</button>
    </section>

    <!-- Preview -->
    <section class="panel preview">
      <div class="preview-empty" id="previewEmpty">
        <svg class="preview-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <path d="M21 15l-5-5L5 21"/>
        </svg>
        <p class="preview-title">GIF preview</p>
      </div>
      <div class="preview-grid" id="previewGrid" hidden></div>
      <button type="button" id="downloadAllBtn" class="primary-btn" hidden disabled>Download All</button>
    </section>

  </main>

  <footer class="statusbar">
    <span id="statusText">Ready</span>
    <div class="progress-track" id="progressTrack" hidden>
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>
  <script src="js/quantize.js"></script>
  <script src="js/gif-writer.js"></script>
  <script src="js/file-loader.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
