<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toggle Button</title>
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }
  button {
    font-size: 1.5rem;
    padding: 0.75rem 2rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <button id="toggleBtn">hello</button>

  <script>
    const btn = document.getElementById('toggleBtn');
    btn.addEventListener('click', () => {
      btn.textContent = btn.textContent === 'hello' ? 'bye' : 'hello';
    });
  </script>
</body>
</html>
